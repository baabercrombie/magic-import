{% extends "base.html" %}
{% block content %}
<h1>Activity</h1>
<p class="muted">Everything the app has done, newest first.</p>
<table class="list">
  <thead><tr><th>When</th><th>What</th><th>Details</th></tr></thead>
  <tbody>
  {% for row in rows %}
    <tr>
      <td class="nowrap small">{{ row.ts|ts }}</td>
      <td><span class="badge {{ row.action }}">{{ row.action }}</span></td>
      <td>{{ row.detail }}
        {% if row.import_id %} <a class="small" href="/imports/{{ row.import_id }}">open</a>{% endif %}</td>
    </tr>
  {% else %}
    <tr><td colspan="3" class="muted">Nothing yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
