<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Magic Import{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🎩 Magic Import</a>
    <nav>
      <a href="/">Home</a>
      <a href="/activity">Activity</a>
      <a href="/setup">Setup check</a>
    </nav>
  </header>
  <main>
    {% if msg %}<div class="flash ok">{{ msg }}</div>{% endif %}
    {% if err %}<div class="flash bad">{{ err }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
